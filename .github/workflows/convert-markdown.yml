name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Convert markdown to HTML
        run: python md-to-html.py $(ls *.md | grep -vx CLAUDE.md)

      # Only what's listed here gets published. HTML is taken only for
      # pages whose .md still exists, so stale committed HTML isn't served.
      - name: Assemble site
        run: |
          mkdir _site
          for md in $(ls *.md | grep -vx CLAUDE.md); do cp "${md%.md}.html" _site/; done
          cp -r .well-known images static styles _site/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
